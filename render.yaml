services:
  # 1. Fastify REST API Service
  - type: web
    name: exam-monitor-api
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter=@exam-monitor/api build
    startCommand: node apps/api/dist/index.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_MODE
        value: webhook
      - key: TELEGRAM_WEBHOOK_URL
        sync: false
      - key: TELEGRAM_WEBHOOK_SECRET
        sync: false

  # 2. Continuous Background Polling Worker
  - type: worker
    name: exam-monitor-worker
    runtime: node
    plan: starter
    buildCommand: pnpm install && pnpm --filter=@exam-monitor/worker build
    startCommand: node apps/worker/dist/index.js
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: EXAM_API_ENDPOINT
        sync: false
      - key: ALLOWED_EXAM_HOSTS
        value: exam-booking.sa.gov.ge,localhost,127.0.0.1
      - key: POLL_INTERVAL_SECONDS
        value: 60
      - key: MIN_POLL_INTERVAL_SECONDS
        value: 30
      - key: TELEGRAM_BOT_TOKEN
        sync: false

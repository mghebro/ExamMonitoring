services:
  # Unified Web Service (API + Background Worker) running on Render Free Tier
  - type: web
    name: exam-monitor-backend
    runtime: node
    plan: free
    buildCommand: pnpm install && pnpm build
    startCommand: node scripts/start-all.js
    healthCheckPath: /health
    autoDeploy: true
    envVars:
      - key: NODE_ENV
        value: production
      - key: PORT
        value: 10000
      - key: SUPABASE_URL
        sync: false
      - key: SUPABASE_ANON_KEY
        sync: false
      - key: SUPABASE_SERVICE_ROLE_KEY
        sync: false
      - key: DATABASE_URL
        sync: false
      - key: NEXT_PUBLIC_APP_URL
        sync: false
      - key: EXAM_API_ENDPOINT
        value: https://exam-booking.sa.gov.ge/practical/dates?CategoryCode=4&CenterId=7&isFirstAttempt=0
      - key: ALLOWED_EXAM_HOSTS
        value: exam-booking.sa.gov.ge,localhost,127.0.0.1
      - key: POLL_INTERVAL_SECONDS
        value: 60
      - key: MIN_POLL_INTERVAL_SECONDS
        value: 30
      - key: REQUEST_TIMEOUT_MS
        value: 30000
      - key: TELEGRAM_BOT_TOKEN
        sync: false
      - key: TELEGRAM_BOT_USERNAME
        sync: false
      - key: TELEGRAM_MODE
        value: polling

